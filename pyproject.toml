[project]
name = "signal-lab"
version = "0.1.0"
description = "Coding-evaluation sandbox: AI in communications and intelligence, built on public APIs."
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["signal_lab", "signal_lab.sources"]
